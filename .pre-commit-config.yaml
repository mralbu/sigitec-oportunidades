# Hooks do prek (https://prek.j178.dev). Instale com `just pre-commit-install`.
# Ruff, ty e pytest rodam via `uv run`, com as versões travadas no uv.lock.
default_install_hook_types: [pre-commit, pre-push]
# O CSV é gerado pelo `sync` (quebras de linha \r\n do csv, BOM, campos com espaços):
# os hooks de texto não podem reescrevê-lo.
exclude: ^data/

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]

      - id: ty
        name: ty check
        entry: uv run --frozen ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run --frozen pytest -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
