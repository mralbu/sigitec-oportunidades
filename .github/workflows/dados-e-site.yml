# Atualiza data/oportunidades.csv uma vez por semana (sync incremental).
#
# O deploy do site no GitHub Pages está desativado enquanto o repositório é privado.
name: Dados e site

on:
  schedule:
    - cron: "17 9 * * 1" # toda segunda-feira, 06:17 em Brasília
  workflow_dispatch:
    inputs:
      full:
        description: "Baixar de novo os detalhes de todas as oportunidades (--full)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dados-e-site
  cancel-in-progress: false

env:
  CSV: data/oportunidades.csv

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar
        run: uv sync --frozen --no-dev

      # Diagnóstico: mede a API a partir do runner (lenta ou bloqueada?). Não falha o job.
      - name: Testar a API
        continue-on-error: true
        run: |
          api=https://sigitec-competitividade.petrobras.com.br/v2/ms-authorization/opportunity
          for path in public-opportunity/2259 getAllPublicOpportunities; do
            curl -sS -o /dev/null --max-time 300 \
              -w "$path: HTTP %{http_code} · conexão %{time_connect}s · TLS %{time_appconnect}s · 1º byte %{time_starttransfer}s · total %{time_total}s · %{size_download} bytes\n" \
              "$api/$path" || echo "$path: falhou (curl $?)"
          done

      - name: Sync
        env:
          FULL: ${{ inputs.full && '--full' || '' }}
        run: |
          uv run --frozen --no-dev sigitec-oportunidades --csv "$CSV" sync $FULL --retries 3
          # O SIGITEC às vezes fica instável: uma segunda passada só baixa o que faltou.
          uv run --frozen --no-dev sigitec-oportunidades --csv "$CSV" sync --retries 3

      - name: Commit do CSV
        run: |
          if git diff --quiet -- "$CSV"; then
            echo "CSV sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CSV"
          git commit -m "Atualiza oportunidades.csv ($(date -u +%Y-%m-%d))"
          git push
